name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py

      - name: Repository contract
        run: python3 scripts/validate_skills.py --verbose

      - name: Lint the completed Vietnamese example
        run: |
          python3 scripts/validate_document.py assets/examples/fds-payment-refund.vi.md \
            --profile fds-vi --min-score 85 --publish

      - name: Convert every template
        run: |
          for file in assets/templates/*.md; do
            python3 scripts/md2storage.py "$file" --check
          done
